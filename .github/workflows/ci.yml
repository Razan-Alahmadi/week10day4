name: .NET Core CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    # Single restore for all projects
    - name: Restore dependencies
      run: dotnet restore

    # Build the test project explicitly 
    - name: Build test project
      run: dotnet build ./ProductTest/ProductTest.csproj --configuration Release --no-restore

    # Run tests with full verbosity to see more details
    - name: Run unit tests
      run: dotnet test ./ProductTest/ProductTest.csproj --configuration Release --logger "trx;LogFileName=test_results.trx" --verbosity normal

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()  
      with:
        name: test-results
        path: '**/test_results.trx'
