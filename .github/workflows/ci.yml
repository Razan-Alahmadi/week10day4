name: .NET Core CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ./Week10-day1/ProductApi.sln

    - name: Build solution
      run: dotnet build ./Week10-day1/ProductApi.sln --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test ./ProductTest/ProductTest.csproj --configuration Release --no-build --logger "trx;LogFileName=test_results.trx"

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/test_results.trx'
